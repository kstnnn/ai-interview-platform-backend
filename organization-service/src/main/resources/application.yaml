server:
  port: 8082

spring:
  config:
    import:
      - "optional:file:.env.local[.properties]"
      - "optional:file:.env[.properties]"
  application:
    name: organization-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZITADEL_ISSUER_URI}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
  threads:
    virtual:
      enabled: true

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080}
  ai-interview-service:
    base-url: ${AI_INTERVIEW_SERVICE_BASE_URL:http://localhost:8081}
  internal-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
