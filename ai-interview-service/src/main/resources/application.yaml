spring:
  config:
    import:
      - "optional:file:.env.local[.properties]"
      - "optional:file:.env[.properties]"
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL}
  application:
    name: ai-interview-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  threads:
    virtual:
      enabled: true
