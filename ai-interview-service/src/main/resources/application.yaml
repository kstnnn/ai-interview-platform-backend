server:
  port: 8081

spring:
  config:
    import:
      - "optional:file:.env.local[.properties]"
      - "optional:file:.env[.properties]"
  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: ${GROQ_BASE_URL}
      chat:
        options:
          model: ${GROQ_MODEL}
    vectorstore:
      chroma:
        initialize-schema: true
        host: ${CHROMA_HOST}
        port: ${CHROMA_PORT}
        collection-name: ${CHROMA_COLLECTION}
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-uri: ${MODEL_ONNX_PATH}
        tokenizer:
          uri: ${MODEL_TOKENIZER_PATH}
  application:
    name: ai-interview-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:/db.changelog/db.changelog-master.yaml
  threads:
    virtual:
      enabled: true
